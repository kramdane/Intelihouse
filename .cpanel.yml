---
deployment:
  tasks:
    # Racine du site. A adapter si l'utilisateur cPanel change.
    - export DEPLOYPATH=/home/intellih/public_html

    - /bin/mkdir -p $DEPLOYPATH/assets
    - /bin/mkdir -p $DEPLOYPATH/images/produits

    # Toutes les pages, y compris celles ajoutees plus tard.
    # Une liste explicite avait laisse les 34 fiches services en 404.
    - /bin/cp -f *.html $DEPLOYPATH/

    # Fichier cache : jamais pris par un caractere joker, d'ou la ligne dediee.
    - /bin/cp -f .htaccess $DEPLOYPATH/

    # Styles, scripts et donnees produits
    - /bin/cp -f assets/style.css $DEPLOYPATH/assets/
    - /bin/cp -f assets/extra.css $DEPLOYPATH/assets/
    - /bin/cp -f assets/rtl.css $DEPLOYPATH/assets/
    - /bin/cp -f assets/app.js $DEPLOYPATH/assets/
    - /bin/cp -f assets/app-ar.js $DEPLOYPATH/assets/
    - /bin/cp -f assets/produits.json $DEPLOYPATH/assets/
    - /bin/cp -f assets/descriptions.json $DEPLOYPATH/assets/

    # Visuels
    - /bin/cp -f images/*.webp $DEPLOYPATH/images/
    - /bin/cp -f images/produits/*.webp $DEPLOYPATH/images/produits/
